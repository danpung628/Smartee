name: Unit Test

# PR 대상 main/dev 일 때 :app JVM unit test (./gradlew testDebugUnitTest) 실행 + functions tsc 빌드 체크.
# lint.yml 과 분리 — lint 실패가 test 결과를 가리지 않도록.

on:
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  unit-test:
    name: Run Unit Tests (testDebugUnitTest)
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17' # AGP 8.10.1 실행에 JDK 17+ 필요 (프로젝트 bytecode 타깃은 JVM 11)
          cache: 'gradle'

      # fail-fast — secret 누락 시 Gradle 까지 가지 않고 즉시 실패.
      - name: Verify required secret is set
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "::error::필수 secret 누락: GOOGLE_SERVICES_JSON_B64 — Settings → Secrets and variables → Actions 에 등록 (base64 of app/google-services.json)"
            exit 1
          fi

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > app/google-services.json

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --continue --parallel

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            **/build/reports/tests/testDebugUnitTest
            **/build/test-results/testDebugUnitTest
          retention-days: 7

  functions-build:
    name: Build Cloud Functions (tsc)
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install deps
        working-directory: functions
        run: npm ci

      - name: Build (tsc)
        working-directory: functions
        run: npm run build
